name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install lychee
        run: |
          curl -sSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.20.0/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/lychee /usr/local/bin/lychee
          lychee --version

      - name: Run verify.sh
        run: bash scripts/verify.sh
